name: Release (vMAJOR.YYMMDD) + Publish Docker

on:
  push:
    branches: ["main"]

  workflow_dispatch:
    inputs:
      force_docker:
        description: "Ejecutar Docker aunque el tag ya exista"
        required: false
        default: "false"
      tag:
        description: "Tag a usar (opcional) ej: v6.260216. Si se deja vacío, se calcula automáticamente."
        required: false
        default: ""

permissions:
  contents: write
  packages: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      created: ${{ steps.version.outputs.CREATED }}

    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version (vMAJOR.YYMMDD)
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          # Si es manual y el usuario pasó un tag, úsalo tal cual.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            VERSION="${{ github.event.inputs.tag }}"

            if ! echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]{6}$'; then
              echo "Tag inválido: $VERSION. Debe ser como v6.260216"
              exit 1
            fi

            if ! git rev-parse "$VERSION" >/dev/null 2>&1; then
              echo "El tag $VERSION no existe en el repo. Crea el tag o ejecuta sin 'tag' para autogenerar."
              exit 1
            fi

            echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
            echo "CREATED=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 1) Último tag del estilo v<major>.<date>
          LAST_TAG=$(git tag -l "v[0-9]*.[0-9][0-9][0-9][0-9][0-9][0-9]" --sort=-creatordate | head -n 1 || true)

          if [ -z "${LAST_TAG}" ]; then
            MAJOR=1
            RANGE=""
          else
            MAJOR="${LAST_TAG#v}"
            MAJOR="${MAJOR%%.*}"
            RANGE="${LAST_TAG}..HEAD"
          fi

          # 2) Detectar si hay cambio grande (major bump)
          MAJOR_BUMP=0
          if [ -n "${RANGE}" ]; then
            if git log "${RANGE}" --pretty=format:%s | grep -Eq '^[a-zA-Z]+!:'; then
              MAJOR_BUMP=1
            fi
            if git log "${RANGE}" --pretty=format:%b | grep -q 'BREAKING CHANGE:'; then
              MAJOR_BUMP=1
            fi
            if git log "${RANGE}" --pretty=format:%s | grep -Eq '^major:'; then
              MAJOR_BUMP=1
            fi
          fi

          if [ "${MAJOR_BUMP}" -eq 1 ]; then
            MAJOR=$((MAJOR + 1))
          fi

          DATE=$(TZ="America/Bogota" date +%y%m%d)
          VERSION="v${MAJOR}.${DATE}"

          if git rev-parse "${VERSION}" >/dev/null 2>&1; then
            echo "Tag ${VERSION} ya existe. No se creará un nuevo release/tag hoy."
            echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "CREATED=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "CREATED=true" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md (Unreleased)
        id: notes
        if: steps.version.outputs.CREATED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          NOTES_FILE="release_notes.md"
          : > "$NOTES_FILE"

          if [ -f "CHANGELOG.md" ]; then
            awk '
              BEGIN{found=0}
              /^#{1,2}[[:space:]]+\[?Unreleased\]?[[:space:]]*$/ {found=1; next}
              found && /^#{1,2}[[:space:]]+/ {exit}
              found {print}
            ' CHANGELOG.md > "$NOTES_FILE"
          fi

          if [ -s "$NOTES_FILE" ]; then
            echo "HAS_NOTES=true" >> "$GITHUB_OUTPUT"
          else
            echo "HAS_NOTES=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create git tag and push
        if: steps.version.outputs.CREATED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag "${{ steps.version.outputs.VERSION }}"
          git push origin "${{ steps.version.outputs.VERSION }}"

      - name: Create GitHub Release (from CHANGELOG)
        if: steps.version.outputs.CREATED == 'true' && steps.notes.outputs.HAS_NOTES == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: ${{ steps.version.outputs.VERSION }}
          body_path: release_notes.md

      - name: Create GitHub Release (auto notes fallback)
        if: steps.version.outputs.CREATED == 'true' && steps.notes.outputs.HAS_NOTES != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: ${{ steps.version.outputs.VERSION }}
          generate_release_notes: true

  docker:
    needs: release
    if: needs.release.outputs.version != '' && (needs.release.outputs.created == 'true' || (github.event_name == 'workflow_dispatch' && github.event.inputs.force_docker == 'true'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image repo to lowercase
        id: img
        shell: bash
        run: |
          echo "REPO_LC=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Backend
        id: build_back
        uses: docker/build-push-action@v5
        with:
          context: ./sententia-back
          push: true
          tags: |
            ghcr.io/${{ steps.img.outputs.REPO_LC }}/sententia-back:${{ needs.release.outputs.version }}
            ghcr.io/${{ steps.img.outputs.REPO_LC }}/sententia-back:latest

      - name: Build & Push Frontend
        id: build_front
        uses: docker/build-push-action@v5
        with:
          context: ./sententia-cli
          push: true
          tags: |
            ghcr.io/${{ steps.img.outputs.REPO_LC }}/sententia-cli:${{ needs.release.outputs.version }}
            ghcr.io/${{ steps.img.outputs.REPO_LC }}/sententia-cli:latest

      - name: Generate docker-compose for this release
        shell: bash
        run: |
          cat > docker-compose.release.yml <<'YML'
          services:
            api:
              image: ghcr.io/${{ steps.img.outputs.REPO_LC }}/sententia-back:${{ needs.release.outputs.version }}
              ports:
                - "8000:8000"
              restart: unless-stopped

            web:
              image: ghcr.io/${{ steps.img.outputs.REPO_LC }}/sententia-cli:${{ needs.release.outputs.version }}
              environment:
                NEXT_PUBLIC_API_URL: http://api:8000
              depends_on:
                - api
              ports:
                - "3000:3000"
              restart: unless-stopped
          YML

      - name: Upload compose to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.version }}
          files: docker-compose.release.yml

      - name: Update GitHub Release with Docker info
        uses: actions/github-script@v7
        env:
          TAG: ${{ needs.release.outputs.version }}
          REPO_LC: ${{ steps.img.outputs.REPO_LC }}
          BACK_DIGEST: ${{ steps.build_back.outputs.digest }}
          FRONT_DIGEST: ${{ steps.build_front.outputs.digest }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = process.env.TAG;
            const repoLc = process.env.REPO_LC;

            const backImage = `ghcr.io/${repoLc}/sententia-back:${tag}`;
            const frontImage = `ghcr.io/${repoLc}/sententia-cli:${tag}`;

            const backDigest = process.env.BACK_DIGEST || "";
            const frontDigest = process.env.FRONT_DIGEST || "";

            const markerStart = "<!-- DOCKER-IMAGES:START -->";
            const markerEnd = "<!-- DOCKER-IMAGES:END -->";

            const dockerBlock = [
              markerStart,
              "### Docker images",
              "",
              "**Backend**",
              `- Image: \`${backImage}\``,
              `- Digest: \`${backDigest}\``,
              `- Pull: \`docker pull ${backImage}\``,
              "",
              "**Frontend**",
              `- Image: \`${frontImage}\``,
              `- Digest: \`${frontDigest}\``,
              `- Pull: \`docker pull ${frontImage}\``,
              "",
              "**Latest**",
              `- Backend: \`docker pull ghcr.io/${repoLc}/sententia-back:latest\``,
              `- Frontend: \`docker pull ghcr.io/${repoLc}/sententia-cli:latest\``,
              markerEnd,
            ].join("\n");

            const { owner, repo } = context.repo;
            const rel = await github.rest.repos.getReleaseByTag({ owner, repo, tag });

            let body = rel.data.body || "";
            const re = new RegExp(`${markerStart}[\\s\\S]*?${markerEnd}`, "m");

            body = re.test(body) ? body.replace(re, dockerBlock) : `${body}\n\n${dockerBlock}`;

            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: rel.data.id,
              body,
            });

services:
  api:
    build:
      context: ./sententia-back
      dockerfile: Dockerfile
    env_file:
      - ./sententia-back/.env
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build:
      context: ./sententia-cli
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api
    ports:
      - "3000:3000"
    restart: unless-stopped